name: Firebase App Distribution

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type to distribute
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

jobs:
  distribute:
    name: Build and distribute
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Decode release keystore
        if: github.ref_name == 'main' || inputs.build_type == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ "${{ github.ref_name }}" == "main" || "${{ inputs.build_type }}" == "release" ]]; then
            ./gradlew :app:assembleRelease
          else
            ./gradlew :app:assembleDebug
          fi

      - name: Upload debug APK to Firebase App Distribution
        if: github.ref_name != 'main' && inputs.build_type != 'release'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ secrets.FIREBASE_TESTER_GROUPS || 'android-testers' }}
          file: app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: ${{ github.event.head_commit.message || 'Manual Firebase distribution' }}

      - name: Upload release APK to Firebase App Distribution
        if: github.ref_name == 'main' || inputs.build_type == 'release'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ secrets.FIREBASE_TESTER_GROUPS || 'android-testers' }}
          file: app/build/outputs/apk/release/app-release.apk
          releaseNotes: ${{ github.event.head_commit.message || 'Manual Firebase distribution' }}
